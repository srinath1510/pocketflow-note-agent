[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    -ra
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may use external services)
    slow: Slow running tests
    external: Tests requiring external services
    api: API endpoint tests
    pipeline: Pipeline flow tests
    notion: Notion integration tests
    neo4j: Neo4j database tests
    llm: LLM/AI service tests

filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning

# Test discovery
norecursedirs = 
    venv
    .git
    __pycache__
    *.egg-info
    build
    dist

# Minimum version
minversion = 7.0

# Coverage settings (if using pytest-cov)
[coverage:run]
source = .
omit = 
    venv/*
    tests/*
    setup.py
    */__pycache__/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    pass